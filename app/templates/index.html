<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Chile — Calculadora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Calculadora Solar Chile</h1>
        <p class="subtitle">Estima la producción anual de tu sistema fotovoltaico</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/output" method="POST">
            <div class="field">
                <label for="city">Ciudad</label>
                <select name="city" id="city" required>
                    {% for c in cities %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="system_size_kw">Tamaño del sistema (kWp)</label>
                <input type="number" name="system_size_kw" id="system_size_kw"
                       min="1" max="100" step="0.5" value="5" required>
            </div>

            <div class="field">
                <label for="tilt">Ángulo de inclinación (°)</label>
                <input type="number" name="tilt" id="tilt"
                       min="0" max="90" step="1" value="30" required>
            </div>

            <div class="field">
                <label for="azimuth">Orientación (° desde el norte, 0=norte)</label>
                <input type="number" name="azimuth" id="azimuth"
                       min="0" max="360" step="5" value="0">
            </div>

            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
</html>
